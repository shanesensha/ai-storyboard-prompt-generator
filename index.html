<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI影视分镜提示词生成器，支持分镜脚本、Seedance 2.0、Kling 3.0和通用AI视频提示词。"
    />
    <title>AI影视分镜提示词生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./i18n.js"></script>
  </head>
  <body class="min-h-screen bg-[#071014] text-slate-100">
    <main class="min-h-screen bg-[#071014] text-slate-100">
      <div class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-4 py-5 sm:px-6 lg:px-8">
        <header class="flex flex-col gap-4 border-b border-white/10 pb-5 sm:flex-row sm:items-end sm:justify-between">
          <div class="max-w-3xl">
            <div class="mb-3 flex items-center gap-2 text-sm font-medium text-cyan-200">
              <span>▣</span>
              <span data-i18n="studio"></span>
            </div>
            <h1 class="text-3xl font-semibold tracking-normal text-white sm:text-5xl" data-i18n="title"></h1>
            <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-300 sm:text-base" data-i18n="subtitle"></p>
          </div>
          <div class="flex items-center gap-2">
            <button
              id="languageButton"
              class="inline-flex h-10 items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 text-sm text-slate-100 transition hover:bg-white/10"
              type="button"
            >
              <span>文</span>
              <span data-i18n="languageButton"></span>
            </button>
            <div class="inline-flex h-10 items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 text-sm text-slate-300">
              <span>◐</span>
              <span data-i18n="darkMode"></span>
            </div>
          </div>
        </header>

        <section class="grid gap-5 lg:grid-cols-[0.9fr_1.1fr]">
          <div class="rounded-lg border border-white/10 bg-[#0c171b] p-4 shadow-2xl shadow-black/20">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h2 class="text-base font-semibold text-white" data-i18n="inputTitle"></h2>
              <span class="text-cyan-200">✦</span>
            </div>
            <textarea
              id="plotInput"
              class="min-h-72 w-full resize-y rounded-md border border-white/10 bg-[#081216] p-4 text-base leading-7 text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-cyan-300/60"
            ></textarea>
            <div class="mt-4 flex flex-col gap-2 sm:flex-row">
              <button
                id="generateButton"
                class="inline-flex h-11 flex-1 items-center justify-center gap-2 rounded-md bg-cyan-300 px-4 text-sm font-semibold text-slate-950 transition hover:bg-cyan-200"
                type="button"
              >
                ✦ <span data-i18n="generate"></span>
              </button>
              <button
                id="copyAllButton"
                class="inline-flex h-11 items-center justify-center gap-2 rounded-md border border-white/10 bg-white/5 px-4 text-sm font-medium text-slate-100 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-50"
                type="button"
                disabled
              >
                ▤ <span data-i18n="copyAll"></span>
              </button>
              <button
                id="exportButton"
                class="inline-flex h-11 items-center justify-center gap-2 rounded-md border border-white/10 bg-white/5 px-4 text-sm font-medium text-slate-100 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-50"
                type="button"
                disabled
              >
                ⇩ <span data-i18n="exportTxt"></span>
              </button>
            </div>
          </div>

          <div class="space-y-5">
            <section class="rounded-lg border border-white/10 bg-[#0c171b] p-4">
              <div class="mb-4 flex items-center justify-between gap-3">
                <h2 class="text-base font-semibold text-white" data-i18n="storyboard"></h2>
                <button class="copy-button inline-flex h-9 items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 text-sm text-slate-100 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-50" data-copy="storyboard" type="button" disabled>
                  ▤ <span data-copy-label></span>
                </button>
              </div>
              <div id="storyboardOutput"></div>
            </section>

            <section class="rounded-lg border border-white/10 bg-[#0c171b] p-4">
              <div class="mb-3 flex items-center justify-between gap-3">
                <h2 class="text-base font-semibold text-white" data-i18n="seedance"></h2>
                <button class="copy-button inline-flex h-9 items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 text-sm text-slate-100 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-50" data-copy="seedance" type="button" disabled>
                  ▤ <span data-copy-label></span>
                </button>
              </div>
              <pre id="seedanceOutput" class="min-h-28 whitespace-pre-wrap break-words rounded-md border border-white/10 bg-[#081216] p-4 text-sm leading-6 text-slate-300"></pre>
            </section>

            <section class="rounded-lg border border-white/10 bg-[#0c171b] p-4">
              <div class="mb-3 flex items-center justify-between gap-3">
                <h2 class="text-base font-semibold text-white" data-i18n="kling"></h2>
                <button class="copy-button inline-flex h-9 items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 text-sm text-slate-100 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-50" data-copy="kling" type="button" disabled>
                  ▤ <span data-copy-label></span>
                </button>
              </div>
              <pre id="klingOutput" class="min-h-28 whitespace-pre-wrap break-words rounded-md border border-white/10 bg-[#081216] p-4 text-sm leading-6 text-slate-300"></pre>
            </section>

            <section class="rounded-lg border border-white/10 bg-[#0c171b] p-4">
              <div class="mb-3 flex items-center justify-between gap-3">
                <h2 class="text-base font-semibold text-white" data-i18n="universal"></h2>
                <button class="copy-button inline-flex h-9 items-center gap-2 rounded-md border border-white/10 bg-white/5 px-3 text-sm text-slate-100 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-50" data-copy="universal" type="button" disabled>
                  ▤ <span data-copy-label></span>
                </button>
              </div>
              <pre id="universalOutput" class="min-h-28 whitespace-pre-wrap break-words rounded-md border border-white/10 bg-[#081216] p-4 text-sm leading-6 text-slate-300"></pre>
            </section>
          </div>
        </section>
      </div>
    </main>

    <script>
      const i18n = window.APP_I18N;
      const state = {
        lang: "zh",
        generated: false,
        copiedKey: "",
        outputs: {
          storyboard: "",
          seedance: "",
          kling: "",
          universal: "",
          all: "",
        },
      };

      const elements = {
        plotInput: document.getElementById("plotInput"),
        languageButton: document.getElementById("languageButton"),
        generateButton: document.getElementById("generateButton"),
        copyAllButton: document.getElementById("copyAllButton"),
        exportButton: document.getElementById("exportButton"),
        storyboardOutput: document.getElementById("storyboardOutput"),
        seedanceOutput: document.getElementById("seedanceOutput"),
        klingOutput: document.getElementById("klingOutput"),
        universalOutput: document.getElementById("universalOutput"),
      };

      function splitPlot(plot) {
        return plot
          .split(/[\n。.!！？?,，；;]+/)
          .map((part) => part.trim())
          .filter(Boolean);
      }

      function fillTemplate(template, beat) {
        return template.replace("{beat}", beat);
      }

      function generateStoryboard(plot, t) {
        const beats = splitPlot(plot);
        const source = beats.length ? beats : t.fallbackBeats;
        const maxShots = Math.min(Math.max(source.length + 1, 4), 6);

        return Array.from({ length: maxShots }, (_, index) => {
          const beat = source[index] || source[source.length - 1];
          const finalShot = index === maxShots - 1;
          return {
            id: index + 1,
            shotSize: t.shotSizes[index % t.shotSizes.length],
            angle: t.angles[index % t.angles.length],
            movement: t.moves[index % t.moves.length],
            action: finalShot ? t.finalAction : fillTemplate(t.actionTemplate, beat),
            scene: fillTemplate(t.sceneTemplate, beat),
            duration: t.durations[index % t.durations.length],
          };
        });
      }

      function formatStoryboard(storyboard, t) {
        return storyboard
          .map(
            (shot) =>
              `${t.shot} ${shot.id}\n${t.shotSize}: ${shot.shotSize}\n${t.angle}: ${shot.angle}\n${t.movement}: ${shot.movement}\n${t.action}: ${shot.action}\n${t.scene}: ${shot.scene}\n${t.duration}: ${shot.duration}`
          )
          .join("\n\n");
      }

      function promptFromStoryboard(plot, storyboard, type, t) {
        const shotList = storyboard
          .map(
            (shot) =>
              `${t.shot} ${shot.id}: ${shot.shotSize}, ${shot.angle}, ${shot.movement}, ${shot.action} ${t.sceneLabel}: ${shot.scene} ${t.durationLabel}: ${shot.duration}`
          )
          .join("\n");
        const base = `${t.plotLabel}: ${plot.trim()}\n\n${shotList}`;

        if (type === "seedance") {
          return `${t.seedance}:\n${base}\n\n${t.styleLabel}: ${t.seedanceStyle}\n${t.avoidLabel}: ${t.seedanceAvoid}`;
        }
        if (type === "kling") {
          return `${t.kling}:\n${base}\n\n${t.generationLabel}: ${t.klingNotes}`;
        }
        return `${t.universal}:\n${base}\n\n${t.universalInstruction}`;
      }

      function formatAll(plot, storyboard, prompts, t) {
        return `${t.inputTitle}\n${plot.trim()}\n\n${t.storyboard}\n${formatStoryboard(
          storyboard,
          t
        )}\n\n${t.seedance}\n${prompts.seedance}\n\n${t.kling}\n${prompts.kling}\n\n${t.universal}\n${prompts.universal}\n`;
      }

      function renderStaticText() {
        const t = i18n[state.lang];
        document.documentElement.lang = t.htmlLang;
        document.title = t.metaTitle;
        document
          .querySelector('meta[name="description"]')
          .setAttribute("content", t.metaDescription);
        document.querySelectorAll("[data-i18n]").forEach((node) => {
          node.textContent = t[node.dataset.i18n];
        });
        elements.plotInput.placeholder = t.placeholder;
        document.querySelectorAll("[data-copy-label]").forEach((node) => {
          node.textContent = t.copy;
        });
      }

      function renderEmptyOutputs() {
        const t = i18n[state.lang];
        elements.storyboardOutput.innerHTML = `<p class="rounded-md border border-dashed border-white/15 p-5 text-sm text-slate-400">${t.empty}</p>`;
        elements.seedanceOutput.textContent = t.empty;
        elements.klingOutput.textContent = t.empty;
        elements.universalOutput.textContent = t.empty;
      }

      function renderStoryboardCards(storyboard) {
        const t = i18n[state.lang];
        elements.storyboardOutput.innerHTML = `<div class="grid gap-3 md:grid-cols-2">${storyboard
          .map(
            (shot) => `
              <article class="rounded-md border border-white/10 bg-[#081216] p-4">
                <div class="mb-3 flex items-center justify-between">
                  <h3 class="text-sm font-semibold text-cyan-200">${t.shot} ${shot.id}</h3>
                  <span class="text-xs text-slate-400">${shot.duration}</span>
                </div>
                <dl class="space-y-2 text-sm leading-6">
                  ${fieldHtml(t.shotSize, shot.shotSize)}
                  ${fieldHtml(t.angle, shot.angle)}
                  ${fieldHtml(t.movement, shot.movement)}
                  ${fieldHtml(t.action, shot.action)}
                  ${fieldHtml(t.scene, shot.scene)}
                </dl>
              </article>`
          )
          .join("")}</div>`;
      }

      function fieldHtml(label, value) {
        return `<div><dt class="text-xs uppercase tracking-normal text-slate-500">${label}</dt><dd class="mt-0.5 text-slate-200">${value}</dd></div>`;
      }

      function setActionButtonsEnabled(enabled) {
        elements.copyAllButton.disabled = !enabled;
        elements.exportButton.disabled = !enabled;
        document.querySelectorAll(".copy-button").forEach((button) => {
          button.disabled = !enabled;
        });
      }

      function renderGeneratedOutputs() {
        const t = i18n[state.lang];
        const storyboard = generateStoryboard(elements.plotInput.value, t);
        const prompts = {
          seedance: promptFromStoryboard(elements.plotInput.value, storyboard, "seedance", t),
          kling: promptFromStoryboard(elements.plotInput.value, storyboard, "kling", t),
          universal: promptFromStoryboard(elements.plotInput.value, storyboard, "universal", t),
        };

        state.outputs.storyboard = formatStoryboard(storyboard, t);
        state.outputs.seedance = prompts.seedance;
        state.outputs.kling = prompts.kling;
        state.outputs.universal = prompts.universal;
        state.outputs.all = formatAll(elements.plotInput.value, storyboard, prompts, t);

        renderStoryboardCards(storyboard);
        elements.seedanceOutput.textContent = prompts.seedance;
        elements.klingOutput.textContent = prompts.kling;
        elements.universalOutput.textContent = prompts.universal;
        setActionButtonsEnabled(true);
      }

      function render() {
        renderStaticText();
        if (state.generated) {
          renderGeneratedOutputs();
        } else {
          renderEmptyOutputs();
          setActionButtonsEnabled(false);
        }
      }

      function switchLanguage() {
        const oldPlaceholder = i18n[state.lang].placeholder;
        state.lang = state.lang === "zh" ? "en" : "zh";
        const nextPlaceholder = i18n[state.lang].placeholder;
        if (elements.plotInput.value === oldPlaceholder) {
          elements.plotInput.value = nextPlaceholder;
        }
        render();
      }

      async function copyValue(key) {
        const value = key === "all" ? state.outputs.all : state.outputs[key];
        if (!value) return;
        await navigator.clipboard.writeText(value);
        const t = i18n[state.lang];
        const button =
          key === "all"
            ? elements.copyAllButton
            : document.querySelector(`[data-copy="${key}"]`);
        const label = button.querySelector("span");
        const original = label.textContent;
        label.textContent = t.copied;
        window.setTimeout(() => {
          label.textContent = original;
        }, 1200);
      }

      function exportTxt() {
        if (!state.outputs.all) return;
        const blob = new Blob([state.outputs.all], {
          type: "text/plain;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "ai-storyboard-prompts.txt";
        link.click();
        URL.revokeObjectURL(url);
      }

      elements.languageButton.addEventListener("click", switchLanguage);
      elements.generateButton.addEventListener("click", () => {
        if (!elements.plotInput.value.trim()) return;
        state.generated = true;
        render();
      });
      elements.plotInput.addEventListener("input", () => {
        state.generated = false;
        render();
      });
      elements.copyAllButton.addEventListener("click", () => copyValue("all"));
      elements.exportButton.addEventListener("click", exportTxt);
      document.querySelectorAll("[data-copy]").forEach((button) => {
        button.addEventListener("click", () => copyValue(button.dataset.copy));
      });

      elements.plotInput.value = i18n.zh.placeholder;
      render();
    </script>
  </body>
</html>
